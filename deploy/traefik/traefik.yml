global:
  checkNewVersion: false
  sendAnonymousUsage: false
  # GHSA-rf44-j88r-hh8c: the fix is opt-in, the default "keep" stays vulnerable
  aliasHeadersStrategy: delete

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
    # X-Forwarded-For is only kept from Cloudflare, anything else gets it overwritten with the peer ip.
    # src: https://www.cloudflare.com/ips/
    forwardedHeaders:
      trustedIPs:
        - 173.245.48.0/20
        - 103.21.244.0/22
        - 103.22.200.0/22
        - 103.31.4.0/22
        - 141.101.64.0/18
        - 108.162.192.0/18
        - 190.93.240.0/20
        - 188.114.96.0/20
        - 197.234.240.0/22
        - 198.41.128.0/17
        - 162.158.0.0/15
        - 104.16.0.0/13
        - 104.24.0.0/14
        - 172.64.0.0/13
        - 131.0.72.0/22
        - 2400:cb00::/32
        - 2606:4700::/32
        - 2803:f800::/32
        - 2405:b500::/32
        - 2405:8100::/32
        - 2a06:98c0::/29
        - 2c0f:f248::/32
  ping:
    address: ":8082"

ping:
  entryPoint: ping

providers:
  docker:
    endpoint: tcp://docker-socket-proxy:2375
    exposedByDefault: false
    network: proxy-exposed

certificatesResolvers:
  letsencrypt:
    acme:
      email: contact@beefy.finance
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}
