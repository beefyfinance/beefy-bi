version: "3.7"

services:
  traefik:
    container_name: traefik
    image: traefik:v3.7.17@sha256:30ff62491aacdb862ceb8c9edcf2627da638d7deafdd4b6dab32fe34f8aa3e90
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - traefik-certs:/letsencrypt
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: "local"
      options:
        max-size: "5M"
        max-file: "3"
    networks:
      - proxy-exposed
      - docker-socket
    depends_on:
      - docker-socket-proxy

  # traefik is internet facing, it only gets a read-only view of the containers instead of docker.sock
  docker-socket-proxy:
    container_name: docker-socket-proxy
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: always
    environment:
      CONTAINERS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "local"
      options:
        max-size: "5M"
        max-file: "3"
    networks:
      - docker-socket

networks:
  proxy-exposed:
    name: proxy-exposed
    external: true
  docker-socket:
    internal: true

volumes:
  traefik-certs:
